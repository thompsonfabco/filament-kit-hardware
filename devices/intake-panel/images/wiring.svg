  <text x="150" y="952" text-anchor="middle" font-size="11" fill="#9fd3ff">Ready</text>
  <text x="150" y="1008" text-anchor="middle" font-weight="600" fill="#2a3a4a">OLED SSD1306 128x64 (0x3C), J1</text>

  <!-- ===== notes ===== -->
  <line x1="30" y1="1030" x2="970" y2="1030" stroke="#ddd"/>
  <g fill="#333" font-size="12">
    <text x="30" y="1052"><tspan font-weight="600">Parts:</tspan> Q1, Q2 BS170 (TO-92, flat face toward you, legs D G S left to right; a 2N7000, legs S G D, fits turned round). RG 220 Ω gate resistors.</text>
    <text x="30" y="1070">RP 100 kΩ gate pull-downs keep the LEDs dark while the C3 resets. Each button's LED is 5 V with its series resistor built in.</text>
    <text x="30" y="1092"><tspan font-weight="600">LEDs:</tspan> 10 to 20 mA each, at most 50 mA; the BS170 conducts only weakly at a 3.3 V gate. Higher or dim: use a logic-level MOSFET (see guide).</text>
    <text x="30" y="1114"><tspan font-weight="600">Speaker:</tspan> only to the screw terminal, ferrules or twisted untinned wire, no capacitor, short leads.</text>
    <text x="30" y="1136"><tspan font-weight="600">Buzzer:</tspan> + to 3V3, not 5V. I2C pull-ups: keep the sensor board's, or add 4.7 kΩ from SDA and SCL to 3V3.</text>
    <text x="30" y="1158"><tspan font-weight="600">Never use</tspan> GPIO 2, 8, 9 (strapping) or 18, 19 (USB). Pin positions vary between Super Mini boards: follow the labels on yours.</text>
    <text x="30" y="1180">Firmware: station/panel in filament-kit. Pins: 3 / 4 buttons (yellow / red), 1 / 7 LEDs, 0 buzzer, 5 SDA, 6 SCL, 10 BCLK, 20 LRC, 21 DIN.</text>
  </g>
</svg>
