<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">
  <rect width="1000" height="1200" fill="#ffffff"/>
  <defs>
    <g id="gnd" stroke="#222" stroke-width="2"><line x1="-10" y1="0" x2="10" y2="0"/><line x1="-6" y1="5" x2="6" y2="5"/><line x1="-2" y1="10" x2="2" y2="10"/></g>
    <g id="v5" stroke="#d22" stroke-width="2"><line x1="-9" y1="0" x2="9" y2="0"/></g>
    <!-- N-channel enhancement MOSFET, gate lead ends at (0,0); drain lead up at (24,-14..), source at (24,14..) -->
    <g id="nmos" stroke="#222" stroke-width="2" fill="none">
      <line x1="0" y1="-14" x2="0" y2="14"/>
      <line x1="8" y1="-18" x2="8" y2="-10"/><line x1="8" y1="-4" x2="8" y2="4"/><line x1="8" y1="10" x2="8" y2="18"/>
      <polyline points="8,-14 24,-14"/><polyline points="8,14 24,14"/>
      <line x1="24" y1="0" x2="24" y2="14"/><line x1="24" y1="0" x2="14" y2="0"/>
      <polygon points="8,0 15,-4 15,4" fill="#222" stroke="none"/>
    </g>
    <!-- push switch, terminals at (0,0) and (-100,0) -->
    <g id="sw" stroke="#222" stroke-width="2" fill="none">
      <line x1="0" y1="0" x2="-30" y2="0"/><line x1="-70" y1="0" x2="-100" y2="0"/>
      <circle cx="-34" cy="0" r="4" fill="#fff"/><circle cx="-66" cy="0" r="4" fill="#fff"/>
      <line x1="-72" y1="-14" x2="-28" y2="-14"/><line x1="-50" y1="-14" x2="-50" y2="-24"/>
    </g>
    <!-- button LED, leads at (0,-13) and (0,13) -->
    <g id="lamp" stroke-width="2" fill="none"><line x1="0" y1="-13" x2="0" y2="-7"/><polygon points="-8,-7 8,-7 0,6" fill="#fff"/><line x1="-8" y1="6" x2="8" y2="6"/><line x1="0" y1="6" x2="0" y2="13"/></g>
    <!-- speaker, leads at (0,0) and (0,30) -->
    <g id="spk" stroke="#222" stroke-width="2" fill="#fff">
      <line x1="0" y1="0" x2="0" y2="6"/><line x1="0" y1="24" x2="0" y2="30"/>
      <rect x="-5" y="6" width="10" height="18"/><polygon points="5,6 16,-2 16,32 5,24"/>
    </g>
  </defs>

  <text x="30" y="34" font-size="18" font-weight="600" fill="#111">Intake panel (ESP32-C3): overview</text>
  <text x="30" y="54" fill="#555">ESP32-C3 Super Mini on the station PC's USB; BS170s switch the button LEDs; MAX98357 module drives the speaker; OLED and room-air sensor on I2C.</text>
  <text x="30" y="72" fill="#555">Every ground symbol joins the C3's G pin and every 5V flag its 5V pin; same-named labels (SDA, SCL, BCLK, LRC, DIN, 3V3, LAMP_HOLD, LAMP_DISCARD) are joined.</text>
  <text x="30" y="90" fill="#555">Assembled on an ElectroCookie full-size prototype board; parts off the board plug into labelled JST-XH headers J1-J5, the speaker into J6.</text>

  <!-- ===== C3 Super Mini ===== -->
  <rect x="400" y="200" width="180" height="340" rx="8" fill="#e8eef5" stroke="#4a6680" stroke-width="2"/>
  <rect x="465" y="188" width="50" height="18" rx="4" fill="#bbb" stroke="#666" stroke-width="1.5"/>
  <text x="490" y="180" text-anchor="middle" fill="#334">USB-C to station PC</text>
  <rect x="445" y="300" width="90" height="62" rx="4" fill="#cfd8e2" stroke="#7a8fa3" stroke-width="1.5"/>
  <text x="490" y="327" text-anchor="middle" fill="#334" font-weight="600">ESP32-C3</text>
  <text x="490" y="343" text-anchor="middle" fill="#556" font-size="11">no Wi-Fi, no BT</text>
  <text x="490" y="430" text-anchor="middle" fill="#334" font-weight="600">C3 Super Mini</text>
  <text x="490" y="446" text-anchor="middle" fill="#556" font-size="11">U1</text>
  <g font-size="12">
    <text x="412" y="254" font-weight="700" fill="#111">5V</text><text x="412" y="290" font-weight="700" fill="#111">G</text>
    <text x="412" y="326" font-weight="700" fill="#111">3V3</text><text x="412" y="362" font-weight="700" fill="#111">4</text>
    <text x="412" y="398" font-weight="700" fill="#111">3</text><text x="412" y="434" fill="#aaa">2</text>
    <text x="412" y="470" font-weight="700" fill="#111">1</text><text x="412" y="506" font-weight="700" fill="#111">0</text>
    <text x="568" y="254" text-anchor="end" font-weight="700" fill="#111">5</text><text x="568" y="290" text-anchor="end" font-weight="700" fill="#111">6</text>
    <text x="568" y="326" text-anchor="end" font-weight="700" fill="#111">7</text><text x="568" y="362" text-anchor="end" fill="#aaa">8</text>
    <text x="568" y="398" text-anchor="end" fill="#aaa">9</text><text x="568" y="434" text-anchor="end" font-weight="700" fill="#111">10</text>
    <text x="568" y="470" text-anchor="end" font-weight="700" fill="#111">20</text><text x="568" y="506" text-anchor="end" font-weight="700" fill="#111">21</text>
  </g>
  <g fill="#4a6680">
    <circle cx="400" cy="250" r="4"/><circle cx="400" cy="286" r="4"/>
    <circle cx="400" cy="322" r="4"/><circle cx="400" cy="358" r="4"/>
    <circle cx="400" cy="394" r="4"/><circle cx="400" cy="430" r="4" fill="#bbb"/>
    <circle cx="400" cy="466" r="4"/><circle cx="400" cy="502" r="4"/>
    <circle cx="580" cy="250" r="4"/><circle cx="580" cy="286" r="4"/>
    <circle cx="580" cy="322" r="4"/><circle cx="580" cy="358" r="4" fill="#bbb"/>
    <circle cx="580" cy="394" r="4" fill="#bbb"/><circle cx="580" cy="430" r="4"/>
    <circle cx="580" cy="466" r="4"/><circle cx="580" cy="502" r="4"/>
  </g>
  <text x="490" y="530" text-anchor="middle" font-size="10" fill="#777">grey: 2, 8, 9 strapping, never used</text>

  <!-- ===== left: power flags, button switches, ground bus ===== -->
  <g stroke-width="2" fill="none">
    <line x1="400" y1="250" x2="365" y2="250" stroke="#d22"/>
    <line x1="365" y1="241" x2="365" y2="259" stroke="#d22"/>
    <line x1="400" y1="322" x2="360" y2="322" stroke="#e08a00"/>
    <polyline points="400,358 320,358 320,340 270,340" stroke="#c0504d"/>
    <polyline points="400,394 300,394 300,420 270,420" stroke="#c08a2c"/>
    <polyline points="400,286 130,286 130,420 170,420" stroke="#222"/>
    <line x1="170" y1="340" x2="130" y2="340" stroke="#222"/>
    <line x1="400" y1="466" x2="360" y2="466" stroke="#c08a2c"/>
  </g>
  <use href="#sw" x="270" y="340"/><use href="#sw" x="270" y="420"/>
  <circle cx="130" cy="340" r="4" fill="#222"/>
  <text x="357" y="254" text-anchor="end" fill="#d22" font-weight="600">5V</text>
  <text x="356" y="326" text-anchor="end" font-weight="700" fill="#e08a00">3V3</text>
  <text x="356" y="470" text-anchor="end" font-weight="700" fill="#8a5a10">LAMP_HOLD</text>
  <text x="220" y="306" text-anchor="middle" font-weight="600" fill="#9a2f2c">DISCARD (red) switch, SW2</text>
  <text x="220" y="450" text-anchor="middle" font-weight="600" fill="#8a5a10">HOLD (yellow) switch, SW1</text>
  <text x="200" y="484" text-anchor="middle" font-size="11" fill="#555">via 4-pin J4 / J3 (GND SW 5V LED-); internal pull-ups, no resistor</text>
  <text x="250" y="281" text-anchor="middle" font-size="11" fill="#555">ground bus to G</text>

  <!-- ===== buzzer (GPIO 0), via J5 ===== -->
  <g stroke-width="2" fill="none">
    <polyline points="400,502 370,502 370,615 330,615" stroke="#5a8a3c"/>
    <line x1="330" y1="640" x2="350" y2="640" stroke="#e08a00"/>
    <rect x="150" y="590" width="180" height="75" rx="6" fill="#eef5ea" stroke="#5a8a3c"/>
    <line x1="240" y1="665" x2="240" y2="680" stroke="#222"/>
  </g>
  <circle cx="190" cy="627" r="20" fill="#333"/><circle cx="190" cy="627" r="5" fill="#666"/>
  <use href="#gnd" x="240" y="680"/>
  <text x="240" y="581" text-anchor="middle" font-weight="600" fill="#3d6a22">3-wire passive buzzer, BZ1 (J5)</text>
  <text x="320" y="619" text-anchor="end" font-size="11" fill="#555">S</text><text x="320" y="644" text-anchor="end" font-size="11" fill="#555">+</text>
  <text x="246" y="661" font-size="11" fill="#555">−</text>
  <text x="354" y="644" font-weight="700" fill="#e08a00">3V3</text>
  <text x="266" y="692" font-size="11" fill="#555">J5 (3-pin) order:</text>
  <text x="266" y="706" font-size="11" fill="#555">GND 3V3 S</text>

  <!-- ===== right: I2C and red LED labels ===== -->
