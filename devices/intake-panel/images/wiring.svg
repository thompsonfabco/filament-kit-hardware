  <text x="80" y="734" text-anchor="middle" font-weight="700" fill="#e08a00">3V3</text>
  <text x="170" y="734" text-anchor="middle" font-weight="700" fill="#7a4a9a">SCL</text>
  <text x="215" y="734" text-anchor="middle" font-weight="700" fill="#2c7a9a">SDA</text>
  <g font-size="11" fill="#555"><text x="80" y="776" text-anchor="middle">VIN</text><text x="125" y="776" text-anchor="middle">GND</text>
    <text x="170" y="776" text-anchor="middle">SCL</text><text x="215" y="776" text-anchor="middle">SDA</text></g>
  <text x="150" y="798" text-anchor="middle" font-weight="600" fill="#4a3a6a">Room air (J2)</text>
  <text x="150" y="812" text-anchor="middle" font-size="10" fill="#555">BME280, or BMP280 + AHT20 (0x38)</text>
  <text x="270" y="790" font-size="11" fill="#555">J1, J2 (4-pin) order:</text>
  <text x="270" y="804" font-size="11" fill="#555">GND 3V3 SDA SCL</text>

  <!-- ===== OLED (same I2C bus, joined by label), via J1 ===== -->
  <g stroke-width="2" fill="none">
    <line x1="80" y1="900" x2="80" y2="880" stroke="#e08a00"/>
    <line x1="125" y1="900" x2="125" y2="890" stroke="#222"/>
