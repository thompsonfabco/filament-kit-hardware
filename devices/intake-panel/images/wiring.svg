    <rect x="625" y="734" width="40" height="12" fill="#fff"/>
    <line x1="665" y1="740" x2="750" y2="740"/>
    <line x1="700" y1="740" x2="700" y2="755"/>
    <rect x="694" y="755" width="12" height="40" fill="#fff"/>
    <line x1="700" y1="795" x2="700" y2="808"/>
    <line x1="774" y1="726" x2="774" y2="700"/>
    <line x1="774" y1="674" x2="774" y2="654" stroke="#d22"/>
    <line x1="774" y1="754" x2="774" y2="778"/>
  </g>
  <circle cx="700" cy="740" r="3.5" fill="#222"/>
  <use href="#nmos" x="750" y="740"/>
  <use href="#lamp" x="774" y="687" stroke="#c08a2c"/>
  <use href="#v5" x="774" y="654"/><use href="#gnd" x="774" y="778"/><use href="#gnd" x="700" y="808"/>
  <text x="774" y="647" text-anchor="middle" fill="#d22" font-weight="600">5V</text>
  <text x="590" y="744" text-anchor="end" font-weight="700" fill="#8a5a10">LAMP_HOLD</text>
  <text x="645" y="728" text-anchor="middle" font-size="11" fill="#555">RG1 220 Ω</text>
  <text x="688" y="780" text-anchor="end" font-size="11" fill="#555">RP1 100 kΩ</text>
  <text x="792" y="744" font-size="11" fill="#555">Q1 BS170</text>
  <text x="780" y="720" font-size="10" fill="#777">D</text><text x="780" y="768" font-size="10" fill="#777">S</text><text x="740" y="730" font-size="10" fill="#777">G</text>
  <text x="794" y="683" font-weight="600" fill="#8a5a10">HOLD LED (in SW1, J3)</text>
  <text x="794" y="697" font-size="11" fill="#555">+ to 5V, − to D; at most 50 mA</text>

  <!-- ===== row B: DISCARD LED (LAMP_DISCARD, GPIO 7), LED in SW2 via J4 ===== -->
  <g stroke="#222" stroke-width="2" fill="none">
    <line x1="595" y1="930" x2="625" y2="930" stroke="#c0504d"/>
    <rect x="625" y="924" width="40" height="12" fill="#fff"/>
    <line x1="665" y1="930" x2="750" y2="930"/>
    <line x1="700" y1="930" x2="700" y2="945"/>
    <rect x="694" y="945" width="12" height="40" fill="#fff"/>
    <line x1="700" y1="985" x2="700" y2="998"/>
    <line x1="774" y1="916" x2="774" y2="890"/>
    <line x1="774" y1="864" x2="774" y2="844" stroke="#d22"/>
    <line x1="774" y1="944" x2="774" y2="968"/>
  </g>
  <circle cx="700" cy="930" r="3.5" fill="#222"/>
  <use href="#nmos" x="750" y="930"/>
  <use href="#lamp" x="774" y="877" stroke="#c0504d"/>
  <use href="#v5" x="774" y="844"/><use href="#gnd" x="774" y="968"/><use href="#gnd" x="700" y="998"/>
  <text x="774" y="837" text-anchor="middle" fill="#d22" font-weight="600">5V</text>
  <text x="590" y="934" text-anchor="end" font-weight="700" fill="#9a2f2c">LAMP_DISCARD</text>
  <text x="645" y="918" text-anchor="middle" font-size="11" fill="#555">RG2 220 Ω</text>
  <text x="688" y="970" text-anchor="end" font-size="11" fill="#555">RP2 100 kΩ</text>
  <text x="792" y="934" font-size="11" fill="#555">Q2 BS170</text>
  <text x="780" y="910" font-size="10" fill="#777">D</text><text x="780" y="958" font-size="10" fill="#777">S</text><text x="740" y="920" font-size="10" fill="#777">G</text>
  <text x="794" y="873" font-weight="600" fill="#9a2f2c">DISCARD LED (in SW2, J4)</text>
  <text x="794" y="887" font-size="11" fill="#555">+ to 5V, − to D; at most 50 mA</text>

