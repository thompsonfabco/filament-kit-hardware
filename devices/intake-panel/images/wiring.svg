  </g>
  <text x="624" y="254" font-weight="700" fill="#2c7a9a">SDA</text>
  <text x="624" y="290" font-weight="700" fill="#7a4a9a">SCL</text>
  <text x="624" y="326" font-weight="700" fill="#9a2f2c">LAMP_DISCARD</text>

  <!-- ===== MAX98357 module (I2S on 10 / 20 / 21) and speaker ===== -->
  <g stroke-width="2" fill="none">
    <line x1="580" y1="430" x2="600" y2="430" stroke="#2c8a7a"/>
    <line x1="580" y1="466" x2="600" y2="466" stroke="#1f6a9a"/>
    <line x1="580" y1="502" x2="600" y2="502" stroke="#6a4a9a"/>
    <line x1="700" y1="420" x2="720" y2="420" stroke="#1f6a9a"/>
    <line x1="700" y1="445" x2="720" y2="445" stroke="#2c8a7a"/>
    <line x1="700" y1="470" x2="720" y2="470" stroke="#6a4a9a"/>
    <line x1="720" y1="495" x2="705" y2="495" stroke="#999"/>
    <line x1="720" y1="520" x2="705" y2="520" stroke="#999"/>
    <line x1="720" y1="545" x2="700" y2="545" stroke="#222"/>
    <line x1="700" y1="545" x2="700" y2="551" stroke="#222"/>
    <line x1="720" y1="570" x2="680" y2="570" stroke="#d22"/>
    <line x1="680" y1="561" x2="680" y2="579" stroke="#d22"/>
    <rect x="720" y="400" width="160" height="190" rx="6" fill="#eaf3f3" stroke="#2c6a6a"/>
    <rect x="880" y="455" width="22" height="70" fill="#3a8a5a" stroke="#235a3a"/>
    <polyline points="902,470 940,470 940,475" stroke="#222"/>
    <polyline points="902,510 940,510 940,505" stroke="#222"/>
  </g>
  <circle cx="705" cy="495" r="3.5" fill="#fff" stroke="#999" stroke-width="1.5"/>
  <circle cx="705" cy="520" r="3.5" fill="#fff" stroke="#999" stroke-width="1.5"/>
  <use href="#gnd" x="700" y="551"/>
  <use href="#spk" x="940" y="475"/>
  <g font-size="11" fill="#333">
    <text x="728" y="424">LRC</text><text x="728" y="449">BCLK</text><text x="728" y="474">DIN</text>
    <text x="728" y="499" fill="#888">GAIN</text><text x="728" y="524" fill="#888">SD</text>
    <text x="728" y="549">GND</text><text x="728" y="574">VIN</text>
  </g>
  <text x="872" y="474" text-anchor="end" font-size="11" fill="#333">+</text>
  <text x="872" y="514" text-anchor="end" font-size="11" fill="#333">−</text>
  <text x="800" y="392" text-anchor="middle" font-weight="600" fill="#1f5a5a">MAX98357 module, U2</text>
  <text x="694" y="502" text-anchor="end" font-size="10" fill="#888">nc</text>
  <text x="694" y="527" text-anchor="end" font-size="10" fill="#888">nc*</text>
  <text x="674" y="574" text-anchor="end" fill="#d22" font-weight="600">5V</text>
  <g font-weight="700" font-size="11">
    <text x="604" y="434" fill="#2c8a7a">BCLK</text><text x="604" y="470" fill="#1f6a9a">LRC</text><text x="604" y="506" fill="#6a4a9a">DIN</text>
    <text x="696" y="424" text-anchor="end" fill="#1f6a9a">LRC</text><text x="696" y="449" text-anchor="end" fill="#2c8a7a">BCLK</text><text x="696" y="474" text-anchor="end" fill="#6a4a9a">DIN</text>
  </g>
  <text x="798" y="600" text-anchor="middle" font-size="10" fill="#555">GAIN open = 9 dB. *SD: measure; if ~0 V, 10 kΩ (RSD) from SD to 3V3.</text>
  <text x="798" y="613" text-anchor="middle" font-size="10" fill="#555">No sound? LRC / BCLK labels may be swapped.</text>
  <text x="798" y="626" text-anchor="middle" font-size="10" fill="#555">If 5V sags: C1 470 µF ≥10 V, + to VIN, − to GND, at the module.</text>
  <text x="891" y="448" text-anchor="middle" font-size="10" fill="#555">J6</text>
  <text x="990" y="540" text-anchor="end" font-weight="600" fill="#1f6a5c">LS1 8 Ω 3 W</text>
  <text x="990" y="554" text-anchor="end" font-size="10" fill="#555">red +, black −</text>
  <text x="990" y="567" text-anchor="end" font-size="10" fill="#555">neither is a ground</text>

  <!-- ===== row A: HOLD LED (LAMP_HOLD, GPIO 1), LED in SW1 via J3 ===== -->
