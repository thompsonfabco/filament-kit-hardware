  <text x="80" y="874" text-anchor="middle" font-weight="700" fill="#e08a00">3V3</text>
  <text x="170" y="874" text-anchor="middle" font-weight="700" fill="#7a4a9a">SCL</text>
  <text x="215" y="874" text-anchor="middle" font-weight="700" fill="#2c7a9a">SDA</text>
  <g font-size="11" fill="#555"><text x="80" y="916" text-anchor="middle">VCC</text><text x="125" y="916" text-anchor="middle">GND</text>
