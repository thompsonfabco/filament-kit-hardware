name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The kit is public, so no token is needed. It is checked out into kit/,
      # which .gitignore lists so the owner-data scan does not treat it as part
      # of this repository.
      - uses: actions/checkout@v4
        with:
          repository: thompsonfabco/filament-kit
          ref: main
          path: kit

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install pytest

      - run: python -m pytest tests -q

      # CI has no tools/owner-terms.local, so the scan prints its note and
      # checks only the generic patterns. That is expected.
      - run: python -I tools/check_owner_data.py

      # The paper check runs in the kicad job, which has kicad-cli.

  kicad:
    runs-on: ubuntu-latest
    # The image runs as the kicad user and keeps its KiCad config under
    # /home/kicad, so run as root (checkout needs to write the workspace) and
    # point KiCad at that config. KICAD_CONFIG_HOME is the folder that holds
    # the versioned 10.0 config folder; without it ERC cannot find the global
    # symbol and footprint library tables and reports every library missing.
    container:
      image: kicad/kicad:10.0
      options: --user root
    env:
      KICAD_CONFIG_HOME: /home/kicad/.config/kicad
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: thompsonfabco/filament-kit
          ref: main
          path: kit

      # ERC on each project's root sheet (the .kicad_sch named like its
      # .kicad_pro), then the paper check, which exports each netlist with
      # this container's kicad-cli.
      - run: |
          for pro in devices/*/kicad/*.kicad_pro devices/*/kicad-smt/*.kicad_pro \
                     devices/*/kicad-power-left/*.kicad_pro devices/*/kicad-smt-power-left/*.kicad_pro; do
            [ -e "$pro" ] || continue
            kicad-cli sch erc --exit-code-violations "${pro%.kicad_pro}.kicad_sch"
          done

      - run: python3 tools/paper_check.py --kit kit

      # Each protoboard drawing's placement file is checked against its schematic's netlist, exported
      # with this container's kicad-cli: every net one group, no shorts, every part pin placed.
      - run: |
          for f in devices/*/protoboard/*.xml; do
            [ -e "$f" ] || continue
            python3 tools/protoboard.py check "$f"
          done

      # A device's surface-mount board (kicad-smt/) must wire exactly what its
      # through-hole board (kicad/) wires, apart from any block listed in
      # kicad-smt/parity-exceptions.txt.
      - run: |
          for pro in devices/*/kicad-smt/*.kicad_pro; do
            [ -e "$pro" ] || continue
            dev="${pro%/kicad-smt/*}"
            exc=""
            [ -e "$dev/kicad-smt/parity-exceptions.txt" ] && exc="--exceptions $dev/kicad-smt/parity-exceptions.txt"
            for tht in "$dev"/kicad/*.kicad_pro; do
              python3 tools/netlist_parity.py "${tht%.kicad_pro}.kicad_sch" "${pro%.kicad_pro}.kicad_sch" $exc
            done
          done

      # A power-left board (for C3 modules with 5V, GND and 3V3 on the left row, seen from above with USB
      # up) copies its power-right base's schematic with only U1's footprint changed, so it must wire
      # exactly the same pins, with no exceptions: kicad-power-left/ against kicad/, and
      # kicad-smt-power-left/ against kicad-smt/.
      - run: |
          for pair in "kicad-power-left kicad" "kicad-smt-power-left kicad-smt"; do
            set -- $pair
            for pro in devices/*/"$1"/*.kicad_pro; do
              [ -e "$pro" ] || continue
              dev="${pro%/"$1"/*}"
              found=0
              for ref in "$dev/$2"/*.kicad_pro; do
                [ -e "$ref" ] || continue
                found=1
                python3 tools/netlist_parity.py "${ref%.kicad_pro}.kicad_sch" "${pro%.kicad_pro}.kicad_sch"
              done
              if [ "$found" != 1 ]; then echo "$pro: no $2/ project to compare with"; exit 1; fi
            done
          done
